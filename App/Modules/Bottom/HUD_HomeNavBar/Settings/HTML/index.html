<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>N3XV5 — ELECTRIC CARBON / Dock prototype</title><style>
:root{--c:#03dfff;--blue:#2377ff;--night:#030b17;--red:#b91637;--pane:rgba(3,11,24,.89)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 72%,#0a2343 0%,#071222 36%,#020711 75%);font:14px 'Segoe UI',system-ui,sans-serif;color:#d4f4ff;min-height:100vh;overflow:hidden}.carbon{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(36deg,transparent 0 6px,#a0caff07 6px 7px),linear-gradient(90deg,#01061385,#04152b44,#01061385)}.sky-grid{position:absolute;inset:0;opacity:.36;background:linear-gradient(#098dda22 1px,transparent 1px),linear-gradient(90deg,#098dda22 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(transparent,#000)}.top{position:fixed;top:0;left:0;right:0;height:65px;border-bottom:1px solid #166ca1;background:#041020d9;display:flex;align-items:center;gap:28px;padding:0 34px;box-shadow:0 8px 30px #001c4a}.brand{font-style:italic;font-size:30px;font-weight:900;letter-spacing:2px;text-shadow:0 0 18px #009dff}.brand i{color:#fa3154}.top span{font-size:12px;color:#5eb8e6;letter-spacing:2px}.top .sub{margin-left:auto;color:#04e9ff}.center{text-align:center;position:absolute;top:28%;left:0;right:0;pointer-events:none}.eyebrow{letter-spacing:7px;color:#3bc9fe;font-size:12px}.center h1{font-size:clamp(35px,7vw,94px);font-weight:900;font-style:italic;letter-spacing:12px;margin:10px 0;background:linear-gradient(#eaffff,#50b9ff,#126bda);color:transparent;background-clip:text;filter:drop-shadow(0 0 22px #0086ff83)}.center p{color:#7fa5c3}.ring{position:absolute;width:400px;height:400px;border:2px dashed #168ad67a;border-radius:50%;left:50%;top:-115px;transform:translateX(-50%);animation:rotate 40s linear infinite;box-shadow:0 0 35px #0067ff40,inset 0 0 50px #0078ff28}.ring:before{content:"";position:absolute;inset:34px;border:2px dotted #0fb8f7a8;border-radius:50%;animation:rotate 18s linear infinite reverse}@keyframes rotate{to{transform:translateX(-50%) rotate(360deg)}}.demo-controls{position:absolute;top:72%;left:50%;transform:translate(-50%,-50%);display:flex;gap:13px;align-items:center;background:#07172bc9;border:1px solid #19557b;padding:12px 18px;border-radius:6px;box-shadow:0 0 25px #035fc22f}.demo-controls label{font-size:12px;color:#83dfff;white-space:nowrap}.demo-controls input{accent-color:var(--c);width:110px}.demo-controls button{color:#bdefff;border:1px solid #1686b5;background:#061e37;cursor:pointer;padding:8px 12px}.demo-controls button:hover{box-shadow:0 0 15px #00d9ff}.dock-zone{position:fixed;bottom:0;left:0;width:100%;z-index:10;padding:0 10px 10px;transition:transform .7s cubic-bezier(.18,.83,.15,1);will-change:transform}.dock-zone.hidden{transform:translateY(calc(100% - 12px))}.dock-zone.hidden:hover,.dock-zone.hidden:focus-within{transform:translateY(0)}.dock{position:relative;width:100%;min-height:85px;border:2px solid #057fc4;clip-path:polygon(1.4% 0,98.6% 0,100% 24%,100% 80%,98.6% 100%,1.4% 100%,0 80%,0 24%);background:linear-gradient(0deg,#020816f5,#071c32e8 32%,#020915f5 80%,#082b44ee);display:flex;align-items:center;gap:11px;padding:10px 17px;box-shadow:inset 0 0 18px #007dff,0 0 24px #009bff8a}.dock:before{content:"";position:absolute;inset:3px;pointer-events:none;clip-path:inherit;border:1px solid #60ddff66;background:repeating-linear-gradient(30deg,transparent 0 7px,#9fccff08 7px 8px)}.line{position:absolute;height:2px;top:4px;left:2%;right:2%;background:linear-gradient(90deg,transparent,#0ef7ff,#097eff,#c92240,#0ef7ff,transparent);background-size:220% 100%;animation:flow 3.4s linear infinite;box-shadow:0 0 9px #00dfff;pointer-events:none}.line.bottom{top:auto;bottom:4px;animation-direction:reverse}@keyframes flow{to{background-position:220% 0}}.runway{position:absolute;top:10px;bottom:10px;width:32px;background:linear-gradient(90deg,transparent,#00dfff1f,transparent);transform:skewX(-30deg);animation:runway 5s linear infinite;pointer-events:none}@keyframes runway{from{left:-5%}to{left:105%}}.dock-item{position:relative;z-index:2;flex:none;display:grid;place-items:center;width:54px;height:54px;border:1px solid #125a8f;clip-path:polygon(13% 0,87% 0,100% 13%,100% 87%,87% 100%,13% 100%,0 87%,0 13%);background:linear-gradient(145deg,#123b58,#020b19 69%);color:#b6efff;cursor:pointer;transition:transform .32s,filter .32s,background .32s;filter:drop-shadow(0 0 2px #00dfff);font-size:28px;outline-offset:5px}.dock-item:hover,.dock-item:focus-visible{transform:translateY(-14px) scale(1.18);background:linear-gradient(145deg,#04568e,#041427);filter:drop-shadow(0 0 13px #00dfff)}.dock-item:active{transform:translateY(-7px) scale(.96)}.dock-item:after{content:"";position:absolute;bottom:2px;width:24px;height:2px;background:#00dfff;box-shadow:0 0 10px #00dfff;opacity:.6}.dock-item.selected{border-color:#2edcff;background:linear-gradient(145deg,#06567e,#04101f);filter:drop-shadow(0 0 9px #00dfff)}.dock-item.selected:after{background:#f52346;box-shadow:0 0 6px #f52346;opacity:1}.dock-item span{pointer-events:none}.dock-item[data-tip]:hover:before{content:attr(data-tip);position:absolute;top:-32px;left:50%;transform:translateX(-50%);font:11px system-ui;white-space:nowrap;background:#041a2c;color:#00eaff;padding:4px 7px;border:1px solid #0aa6ed}.window-pill{min-width:180px;max-width:300px;flex:1;height:52px;z-index:2;border:1px solid #1076bb;background:linear-gradient(90deg,#071d32,#081c32ad);display:flex;align-items:center;gap:11px;padding:0 15px;clip-path:polygon(0 18%,6% 0,95% 0,100% 25%,100% 75%,95% 100%,6% 100%,0 82%);box-shadow:inset 0 0 10px #0368c7;cursor:pointer;white-space:nowrap;overflow:hidden;color:#b7eeff}.window-pill:hover{background:#07395f}.window-pill span:last-child{overflow:hidden;text-overflow:ellipsis}.separator{height:43px;width:1px;background:linear-gradient(transparent,#1cacff,transparent);margin:0 4px;z-index:1}.spacer{flex:1}.tray{display:flex;align-items:center;gap:13px;z-index:2}.tray button{cursor:pointer;background:none;border:0;color:#8ddeff;font-size:22px;transition:transform .3s,text-shadow .3s}.tray button:hover{transform:translateY(-6px) scale(1.2);text-shadow:0 0 15px #00dfff}.clock{font-weight:700;min-width:54px;color:#22ecff;font-size:20px;text-shadow:0 0 14px #00aeff}.reactor{z-index:5;width:76px;height:76px;flex:none;border:2px solid #11bfff;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#093965,#020a18 68%);box-shadow:0 0 15px #008cff,inset 0 0 17px #00bfff;cursor:pointer;position:relative;margin:0 2px}.reactor:before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px dashed #00c8ff;animation:spin 7s linear infinite}.reactor:after{content:"";position:absolute;inset:8px;border:2px solid #0aeaff65;border-radius:50%;animation:breathe 1.7s ease-in-out infinite}.reactor b{font-size:29px;color:#b7f8ff;text-shadow:0 0 16px #07cfff;z-index:2;transition:transform .45s}.reactor:hover b{transform:scale(1.25)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{50%{box-shadow:0 0 27px #02ceff;opacity:.4}}.dock-zone.hidden .reactor b{transform:rotate(180deg)}.status-led{width:7px;height:7px;background:#0fefff;box-shadow:0 0 12px #0fefff;border-radius:50%;animation:breathe 1s infinite}.toast{position:fixed;bottom:117px;right:25px;padding:13px 20px;border:1px solid #01aaff;background:#04152bf2;color:#caf8ff;box-shadow:0 0 25px #006dff7a;transform:translateY(12px);opacity:0;pointer-events:none;transition:.28s;z-index:30}.toast.on{transform:translateY(0);opacity:1}.hidden .dock{box-shadow:0 0 22px #06b8ff}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:920px){.dock{gap:5px;padding:9px}.dock-item{width:42px;height:48px;font-size:23px}.tray{gap:5px}.tray button:nth-child(-n+3){display:none}.window-pill{min-width:95px}.reactor{width:60px;height:60px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body><div class="carbon"></div><div class="sky-grid"></div><header class="top"><div class="brand">N3<i>X</i>V5</div><span>ELECTRIC CARBON · BOTTOM DOCK / PROTOTYPE</span><span class="sub">◉ SYSTEM READY</span></header><div class="center"><div class="ring"></div><div class="eyebrow">DEVELOPMENT / LIVE PREVIEW</div><h1>N3XV5 HUD</h1><p>Réacteur néon · signaux PCB · icônes interactives · repli automatique</p></div><div class="demo-controls"><label><input id="auto" type="checkbox" checked> Repli automatique</label><label>Hauteur <input type="range" id="height" min="70" max="140" value="85"></label><label>Énergie <input type="range" id="energy" min="0" max="100" value="75"></label><button id="toggle">Replier / déplier</button></div><div class="dock-zone" id="zone" tabindex="-1"><nav class="dock" id="dock" aria-label="N3XV5 navigation inférieure"><div class="line"></div><div class="line bottom"></div><div class="runway"></div><button class="dock-item selected" data-tip="Linux Mint" aria-label="Menu système"><span>Ⓜ</span></button><button class="dock-item" data-tip="Firefox" aria-label="Firefox"><span>🦊</span></button><button class="dock-item" data-tip="Terminal" aria-label="Terminal"><span>⌘</span></button><button class="dock-item" data-tip="Fichiers" aria-label="Gestionnaire de fichiers"><span>📁</span></button><div class="separator"></div><button class="window-pill" id="window"><span>📂</span><span>Documents — NEXUS Project</span></button><div class="spacer"></div><div class="status-led"></div><button class="reactor" id="reactor" aria-label="Déplier ou replier la barre"><b>⌃</b></button><div class="spacer"></div><div class="tray"><button aria-label="Bluetooth">ᛒ</button><button aria-label="Sécurité">⬡</button><button aria-label="Wi-Fi">◉</button><button aria-label="Audio">◖))</button><button aria-label="Notifications">♧</button></div><div class="separator"></div><time class="clock" id="clock">--:--</time><button class="dock-item" aria-label="Paramètres" data-tip="Paramètres"><span>⚙</span></button></nav></div><div class="toast" id="toast" role="status"></div><script>
const zone=document.getElementById('zone'),dock=document.getElementById('dock'),auto=document.getElementById('auto'),energy=document.getElementById('energy');let tid,collapsed=false;const toast=document.getElementById('toast');function notify(s){toast.textContent=s;toast.classList.add('on');clearTimeout(notify.t);notify.t=setTimeout(()=>toast.classList.remove('on'),1800)}function fold(v){collapsed=v;zone.classList.toggle('hidden',v)}function schedule(){clearTimeout(tid);if(auto.checked&& !zone.matches(':hover')&&!zone.matches(':focus-within'))tid=setTimeout(()=>fold(true),2200)}zone.addEventListener('mouseenter',()=>{clearTimeout(tid);fold(false)});zone.addEventListener('mouseleave',schedule);zone.addEventListener('focusin',()=>{clearTimeout(tid);fold(false)});zone.addEventListener('focusout',()=>setTimeout(schedule,20));auto.addEventListener('change',()=>{if(!auto.checked)fold(false);else schedule()});document.getElementById('toggle').onclick=()=>{fold(!collapsed);if(!collapsed)schedule()};document.getElementById('reactor').onclick=()=>{fold(!collapsed);notify(collapsed?'Dock rétracté':'Réacteur activé');if(!collapsed)schedule()};document.getElementById('height').oninput=e=>dock.style.minHeight=e.target.value+'px';energy.oninput=e=>{dock.style.filter=`brightness(${.6+e.target.value/100})`;document.querySelector('.runway').style.animationDuration=(9-e.target.value*.065)+'s'};document.querySelectorAll('.dock-item,.tray button,.window-pill').forEach(el=>el.addEventListener('click',()=>{if(el.classList.contains('dock-item')){document.querySelectorAll('.dock-item').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}notify(el.dataset.tip||el.getAttribute('aria-label')||'Fenêtre sélectionnée');fold(false);schedule()}));function clock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,15000);schedule();
</script></body></html>
